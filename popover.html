<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>popover</title>
		<style>
			.popover-elm::backdrop{
		        padding: 0.5rem;
		      	background-color: rgba(0, 0, 0, 0.3)
		      }
		</style>
	</head>
	<body>
		<button type="button" popovertarget="auto-popover-elm">auto
		  popover button
		</button>
		<div class="popover-elm" popover="auto" id="auto-popover-elm">auto 
		  popover div
		</div>
		<button type="button" popovertarget="hint-popover-elm">hint
		  popover button
		</button>
		<div class="popover-elm" popover="hint" id="hint-popover-elm">hint 
		  popover div
		</div>
		<button type="button" popovertarget="manual-popover-elm">manual
		  popover button
		</button>
		<div class="popover-elm" popover="manual" id="manual-popover-elm">manual 
		  popover div
		</div>
		<br/>
		<button type="button" popovertarget="auto-popover-elm-2">auto
		  popover button 2
		</button>
		<div class="popover-elm" popover="auto" id="auto-popover-elm-2">auto 
		  popover div 2
		</div>
		<button type="button" popovertarget="hint-popover-elm-2">hint
		  popover button 2
		</button>
		<div class="popover-elm" popover="hint" id="hint-popover-elm-2">hint 
		  popover div 2
		</div>
		<button type="button" popovertarget="manual-popover-elm-2">manual
		  popover button 2
		</button>
		<div class="popover-elm" popover="manual" id="manual-popover-elm-2">manual 
		  popover div 2
		</div>
		
	</body>
</html>
