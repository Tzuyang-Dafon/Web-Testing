<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
	<meta charset="UTF-8" />
	<title>Browser Check</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<style>
		dialog {
			background-color: #a3d;
			color: #333;
			width: 300px;

		}
	</style>
</head>

<body>
	<button onclick="document.querySelector('dialog-1')?.showModal()">
		Open Dialog
		1</button>
	<button onclick="document.querySelector('dialog-2')?.showModal()">
		Open Dialog
		2</button>
	<button onclick="document.querySelector('dialog-3')?.showModal()">
		Open Dialog
		3
	</button>
	<dialog id="dialog-1" style="min-height: 300px">
		min-height: 300px
		<br />
		<button onclick="document.querySelector('dialog-1').close()">Close</button>
	</dialog>
	<dialog id="dialog-2" style="min-height: 20vh">
		min-height: 20vh
		<br />
		<button onclick="document.querySelector('dialog-2').close()">Close</button>
	</dialog>
	<dialog id="dialog-3" style="min-height: 300px; height: 20vh">
		min-height: 300px
		<br/>
		<button onclick="document.querySelector('dialog-3').close()">Close</button>
	</dialog>
</body>
