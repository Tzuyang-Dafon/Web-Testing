<html lang="en" class="">
	<head>
		
		<meta charset="UTF-8" />
		<title>vh Demo</title>
		
		<meta name="robots" content="noindex" /> 
		
		
		
		
		<style>
			body{
				padding: 0;
				margin: 0;
			}
			#block{
				display: inline-block;
				min-height: 100px;
				width: 40vw;
				background-color: rgba(35, 180, 99, 0.7);
			}
			#choise{
				display: inline-block;
				min-height: 80vh;  
			
			}
		</style>
	
	
	</head>
	
	<body>
		
		<div id="block">block</div>
		<div id="choise">
			<button onclick="document.getElementById('block').style.height = '100vh'">vh
			</button>
			<button onclick="document.getElementById('block').style.height = '100dvh'">dvh
			</button>
			<button onclick="document.getElementById('block').style.height = '100svh'">svh
			</button>
			<button onclick="document.getElementById('block').style.height = '100lvh'">lvh
			</button>
		</div>
	
	
	
	
	</body>
</html>
